<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency</title>
    <link rel="stylesheet" href="style.css">
    <!--JS is here for now it will need to be moved later-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header>
        <div class="name">
            <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            CurrencyChacker
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Crypt</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="logInButtons">
            <a href="login.html" class="btn btn-text">Log In</a>
            <a href="register.html" class="btn btn-primary">Sign Up</a>
        </div>

    </header>

    <main>
        <div class="hero-section">
            <div class="leftPart">
                <div class="chart-wrapper">
                    <div class="chart-header-row">
                        <div class="chart-title-group">
                            <div class="select-wrapper">
                                <select id="chartCurrencySelect" onchange="changeCurrency(this.value)">
                                    <option value="USD">USD / UAH</option>
                                    <option value="EUR">EUR / UAH</option>
                                    <option value="GBP">GBP / UAH</option>
                                    <option value="BTC">BTC / USD</option>
                                </select>
                                <span class="custom-arrow">▼</span>
                            </div>

                            <div class="price-info">
                                <h2 id="currentRate">41.50</h2>
                                <p id="rateChange" class="rate-change positive">
                                    +0.45% <span class="time-label">(сьогодні)</span>
                                </p>
                            </div>
                        </div>

                        <div class="time-controls">
                            <button class="time-btn active" onclick="updateTimePeriod('1D')">1D</button>
                            <button class="time-btn" onclick="updateTimePeriod('1W')">1W</button>
                            <button class="time-btn" onclick="updateTimePeriod('1M')">1M</button>
                        </div>
                    </div>
                    <div class="canvas-container">
                        <canvas id="currencyChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="rightPart">
                <div class="converter-card">
                    <div class="converter-header">Quick currency converter</div>

                    <div class="input-group">
                        <input type="number" value="1">
                        <select class="currency-select">
                            <option value="USD">USD</option>
                            <option value="UAH">UAH</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="PLN">PLN</option>
                            <option value="JPY">JPY</option>
                            <option value="CNY">CNY</option>
                            <option value="CAD">CAD</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>

                    <div class="swap-icon">
                        <button class="swap-btn">⇅</button>
                    </div>

                    <div class="input-group">
                        <input type="text" value="41.50">
                        <select class="currency-select">
                            <option value="UAH">UAH </option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP </option>
                            <option value="PLN">PLN</option>
                            <option value="JPY">JPY</option>
                            <option value="CNY">CNY</option>
                            <option value="CAD">CAD</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>

                    <button class="btn btn-primary convert-btn">Convert Now</button>
                </div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-info">
                    <img src="Flag_of_Europe.svg.webp" alt="">
                    <h3>EUR</h3>
                </div>
                <div class="stat-value">43.92</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <img src="Flag_of_the_United_Kingdom_(3-5).svg.webp" alt="">
                    <h3>GBP</h3>
                </div>
                <div class="stat-value">52.18</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <img src="Flag_of_the_People's_Republic_of_China.svg" alt="">
                    <h3>CHF</h3>
                </div>
                <div class="stat-value">46.75</div>
            </div>
        </div>
    </main>
</body>
<!--Example generated by Gemini i think we will make like automaticly updating sustem-->
<script>
    const ctx = document.getElementById('currencyChart').getContext('2d');

    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
    gradient.addColorStop(0, 'rgba(0, 227, 150, 0.5)');
    gradient.addColorStop(1, 'rgba(0, 227, 150, 0.0)');


    const currencyData = {
        USD: {
            current: '41.50',
            change: '+0.45%',
            isPositive: true,
            labels: ['10:00', '11:00', '12:00', '13:00', '14:00', '15:00'],
            data: [41.20, 41.35, 41.25, 41.40, 41.45, 41.50]
        },
        EUR: {
            current: '45.20',
            change: '-0.12%',
            isPositive: false,
            labels: ['10:00', '11:00', '12:00', '13:00', '14:00', '15:00'],
            data: [45.50, 45.40, 45.35, 45.30, 45.25, 45.20]
        },
        GBP: {
            current: '53.80',
            change: '+1.10%',
            isPositive: true,
            labels: ['10:00', '11:00', '12:00', '13:00', '14:00', '15:00'],
            data: [52.90, 53.10, 53.40, 53.50, 53.60, 53.80]
        },
        BTC: {
            current: '96,500',
            change: '+5.4%',
            isPositive: true,
            labels: ['10:00', '11:00', '12:00', '13:00', '14:00', '15:00'],
            data: [92000, 93500, 94000, 95500, 96000, 96500]
        }
    };

    let chartConfig = {
        type: 'line',
        data: {
            labels: currencyData.USD.labels,
            datasets: [{
                label: 'Price',
                data: currencyData.USD.data,
                borderColor: '#00E396',
                backgroundColor: gradient,
                borderWidth: 3,
                pointRadius: 0,
                pointHoverRadius: 6,
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false }, ticks: { color: '#8B9BB4' } },
                y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#8B9BB4' } }
            },
            interaction: { mode: 'index', intersect: false }
        }
    };

    let myChart = new Chart(ctx, chartConfig);

    function changeCurrency(currencyKey) {
        const data = currencyData[currencyKey];

        document.getElementById('currentRate').innerText = data.current;

        const changeElem = document.getElementById('rateChange');
        changeElem.innerHTML = `${data.change} <span class="time-label">(сьогодні)</span>`;

        if (data.isPositive) {
            changeElem.className = 'rate-change positive';
            myChart.data.datasets[0].borderColor = '#00E396';
        } else {
            changeElem.className = 'rate-change negative';
            myChart.data.datasets[0].borderColor = '#FF4560';
        }

        myChart.data.labels = data.labels;
        myChart.data.datasets[0].data = data.data;
        myChart.update();
    }

    function updateTimePeriod(period) {
        document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

    }
</script>

</html>
